name: Spoon zip

# SpoonInstall downloads Spoons/EmacsAnywhere.spoon.zip from main, so the
# committed zip must hold exactly what EmacsAnywhere.spoon/ holds.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Compare the zip with the source
        run: |
          tmp=$(mktemp -d)
          unzip -q Spoons/EmacsAnywhere.spoon.zip -d "$tmp"
          if ! diff -r "$tmp/EmacsAnywhere.spoon" EmacsAnywhere.spoon; then
            echo "::error::Spoons/EmacsAnywhere.spoon.zip is stale. Run scripts/build-spoon-zip.sh and commit the zip."
            exit 1
          fi
